<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="assets/css/styles.css">
    <title data-i18n="projects.magazinemunicipal.title"></title>
  </head>
  <body>
    <!-- ===== LANGUAGE SWITCHER ===== -->
    <div class="language-switcher">
      <button onclick="setLanguage('en')">EN</button>
      <button onclick="setLanguage('fr')">FR</button>
    </div>
  
    <!-- ===== HEADER ===== -->
    <header class="l-header">
      <nav class="nav bd-grid">
        <div>
          <a href="index.html" class="nav__logo" data-i18n="logo"></a>
        </div>
  
        <div class="nav__menu" id="nav-menu">
          <ul class="nav__list">
            <li class="nav__item"><a href="index.html#home" class="nav__link" data-i18n="home">Home</a></li>
            <li class="nav__item"><a href="index.html#about" class="nav__link" data-i18n="about">About</a></li>
            <li class="nav__item"><a href="index.html#skills" class="nav__link" data-i18n="skills">Skills</a></li>
            <li class="nav__item"><a href="index.html#work" class="nav__link" data-i18n="work">Work</a></li>
            <li class="nav__item"><a href="index.html#contact" class="nav__link" data-i18n="contact">Contact</a></li>
          </ul>
        </div>
  
        <div class="nav__toggle" id="nav-toggle">
          <i class='bx bx-menu'></i>
        </div>
      </nav>
    </header>
  
    <!-- ===== PROJECT CONTENT ===== -->
    <main class="l-main">
      <section class="project section">
        <h2 class="section-title" data-i18n="projects.magazinemunicipal.title"></h2>
  
        <!-- Intro -->
        <div class="project__intro" data-i18n="projects.magazinemunicipal.intro"></div>

        <!-- Type -->
        <p class="project__type" data-i18n="projects.magazinemunicipal.type"></p>

		<!-- Covers of the 4 issues: each one links to the full issue -->
        <!-- To change a cover: replace the image file name (src) and the link (href) -->
        <div class="project__covers">
          <!-- Summer issue -->
          <a class="project__cover" href="https://www.calameo.com/books/0082661313a48e65ec5e6?authid=AS1rCq92q3K6" target="_blank" rel="noopener">
            <img src="assets/img/magazine_ete.jpg" alt="Cover of the summer issue">
          </a>
          <!-- Autumn issue -->
          <a class="project__cover" href="https://www.calameo.com/read/008266131993313436840?authid=q4o0jXvsg12m" target="_blank" rel="noopener">
            <img src="assets/img/magazine_automne.jpg" alt="Cover of the autumn issue">
          </a>
          <!-- Winter issue -->
          <a class="project__cover" href="https://www.calameo.com/read/008266131246000d3835b?authid=pGZxLrL07MEG" target="_blank" rel="noopener">
            <img src="assets/img/magazine_hiver.jpg" alt="Cover of the winter issue">
          </a>
          <!-- Spring issue -->
          <a class="project__cover" href="https://www.calameo.com/read/008266131682c4695ba59?authid=9vZSjM3ISy5z" target="_blank" rel="noopener">
            <img src="assets/img/magazine_printemps.jpg" alt="Cover of the spring issue">
          </a>
        </div>
        <p class="project__note" data-i18n="projects.magazinemunicipal.coversHint"></p>

        <!-- Caption for the pages below -->
        <p class="project__note project__note--gallery" data-i18n="projects.magazinemunicipal.galleryCaption"></p>
  
        <!-- Gallery -->
        <div class="project__gallery bd-grid">
		  <img src="assets/img/magazinemunicipal_01_cover.jpg" alt="Cover">
		  <img src="assets/img/magazinemunicipal_02_toc.jpg" alt="Table of contents spread"> 
          <img src="assets/img/magazinemunicipal_03_article.jpg" alt="Article example 1">
          <img src="assets/img/magazinemunicipal_04_interview.jpg" alt="Interview">
          <img src="assets/img/magazinemunicipal_05_article.jpg" alt="Article example 1">
          <img src="assets/img/magazinemunicipal_06_events.jpg" alt="Events">
        </div>
      </section>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
      <p class="footer__title" data-i18n="logo"></p>
      <div class="footer__social">
          <a href="https://www.linkedin.com/in/juliadupin/" target="_blank" class="footer__icon"><i class='bx bxl-linkedin'></i></a>
          <a href="https://www.behance.net/juliadupin" target="_blank" class="footer__icon"><i class='bx bxl-behance' ></i></a>
          <a href="https://www.instagram.com/julia.dupin.design/" target="_blank" class="footer__icon"><i class='bx bxl-instagram' ></i></a>
      </div>
    </footer>

    <script src="assets/js/main.js"></script>
